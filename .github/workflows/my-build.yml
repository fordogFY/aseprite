name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Aseprite code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Dependencies & Ninja
      run: choco install ninja

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download Skia prebuilt binary
      run: |
        curl -L -o Skia-Windows-Release-x64.zip https://github.com/aseprite/skia/releases/download/m102-861e474326/Skia-Windows-Release-x64.zip
        7z x Skia-Windows-Release-x64.zip -o"C:\skia"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_UI=ON -DLAF_BACKEND=skia -DSKIA_DIR="C:\skia" -DSKIA_LIBRARY_DIR="C:\skia\out\Release-x64" -DSKIA_LIBRARY="C:\skia\out\Release-x64\skia.lib" -G Ninja ..

    - name: Compile Aseprite
      run: |
        cd build
        ninja aseprite

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows
        path: build/bin/
